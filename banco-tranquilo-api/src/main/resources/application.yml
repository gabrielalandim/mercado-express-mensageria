server:
  port: ${PORT:8082}

spring:
  application:
    name: banco-tranquilo-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bancotranquilo}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 2s
        default-requeue-rejected: false

banco:
  delay-processamento-ms: ${BANCO_DELAY_MS:1500}
  seed-demo-data: ${SEED_DEMO_DATA:true}

logging:
  level:
    br.com.fiap.bancotranquilo: INFO
